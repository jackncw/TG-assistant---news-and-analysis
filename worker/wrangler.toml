name = "tg-qa-worker"
main = "index.js"
compatibility_date = "2026-07-01"

# Public repo path is not a secret; secrets go in via `wrangler secret put`:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put ALLOWED_CHAT_ID
#   wrangler secret put GH_PAT
[vars]
GH_REPO = "jackncw/TG-assistant---news-and-analysis"

# Create the namespace first, then paste its id here:
#   wrangler kv namespace create QA_COUNTER
[[kv_namespaces]]
binding = "QA_COUNTER"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
